name: Build and verify pilot packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: python -m unittest discover -s tests -q
      - name: Install native LibreOffice on macOS
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice
      - name: Verify real LibreOffice conversion and full citation links
        if: runner.os == 'macOS'
        run: python scripts/verify_feedback_office.py --output output/feedback-office
      - name: Verify retained web citations and mixed Word runs
        if: runner.os == 'macOS'
        run: python scripts/verify_reference_options_office.py --output output/feedback-office/reference-options
      - name: Verify bitmap images, TOC and relative links in LibreOffice PDF
        if: runner.os == 'macOS'
        run: python scripts/verify_office_images.py --output output/feedback-office/images
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os == 'macOS'
        with:
          name: office-review-${{ matrix.target }}
          path: output/feedback-office
      - run: python scripts/build_bundle.py
      - run: python scripts/bundle_smoke.py release/BLExhibitManager-0.1.3-rc.4-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
