name: Build and verify pilot packages
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      viewer_only:
        description: Verify final PDF links in SumatraPDF on an isolated Windows desktop
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pilot-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native-package:
    if: ${{ !inputs.viewer_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install build dependencies with static OpenSSL
        # Intel macOS builds cryptography from source. Keep its OpenSSL separate
        # from Python's libssl.3, which PyInstaller also bundles.
        env:
          OPENSSL_STATIC: '1'
        run: python -m pip install --no-cache-dir -r requirements-build.txt
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npx --prefix web playwright install chromium
      - name: Verify library creation during delayed catalog loading
        run: node --test scripts/library_loading_ui.cjs
      - run: node --test web/tests/*.test.js
      - run: python -m unittest discover -s tests -q
      - name: Verify submission index browser flow and bounded load
        run: python scripts/verify_submission_index.py --output output/submission-index-qa
      - name: Verify native local Word setup (simulated Word host)
        run: python scripts/verify_word_setup_native.py
      - run: python scripts/build_bundle.py
      - run: python scripts/generate_legacy_archives.py
      - run: python scripts/bundle_smoke.py release/BLExhibitManager-0.6.0-${{ matrix.target }}.zip
        env:
          EXHIBIT_BROWSER_QA: '1'
      - name: Verify update from released 0.5.1 and guarded rollback
        run: python scripts/verify_index_upgrade.py release/BLExhibitManager-0.6.0-${{ matrix.target }}.zip --output output/submission-index-qa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: index-qa-${{ matrix.target }}
          path: output/submission-index-qa
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backup-${{ matrix.target }}
          path: output/backup-exchange/${{ matrix.target }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ready-qa-${{ matrix.target }}
          path: output/native-ready-qa/${{ matrix.target }}
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-${{ matrix.target }}
          path: output/legacy-archives/
          if-no-files-found: error
      - name: Install native LibreOffice on macOS
        if: runner.os == 'macOS'
        run: bash scripts/install_ci_libreoffice.sh
      - name: Verify real LibreOffice conversion and full citation links
        if: runner.os == 'macOS'
        run: python scripts/verify_feedback_office.py --output output/feedback-office
      - name: Render submission index in real LibreOffice
        if: runner.os == 'macOS'
        run: python scripts/verify_index_office.py --output output/feedback-office/submission-index
      - name: Verify retained web citations and mixed Word runs
        if: runner.os == 'macOS'
        run: python scripts/verify_reference_options_office.py --output output/feedback-office/reference-options
      - name: Verify conservative recovery after controlled annotation loss
        if: runner.os == 'macOS'
        run: python scripts/verify_link_recovery_office.py --output output/feedback-office/link-recovery
      - name: Verify unchanged ready forms and signatures through real LibreOffice
        if: runner.os == 'macOS'
        run: python scripts/verify_ready_pdf.py --office --output output/feedback-office/ready-pdf
      - name: Verify bitmap images, TOC and relative links in LibreOffice PDF
        if: runner.os == 'macOS'
        run: python scripts/verify_office_images.py --output output/feedback-office/images
      - name: Verify library import and rename with real LibreOffice
        if: runner.os == 'macOS'
        run: python scripts/verify_library_office.py --output output/feedback-office/library
      - name: Verify DOCX revisions and immutable history without Word pane
        if: runner.os == 'macOS'
        run: python scripts/verify_revisions_office.py --output output/feedback-office/revisions
      - name: Install layout measurement tools for synthetic QA only
        if: runner.os == 'macOS'
        run: python -m pip install pymupdf==1.28.2
      - name: Verify footnote offsets, linked DOCX, typography and explicit signature grouping
        if: runner.os == 'macOS'
        run: python scripts/layout_probe.py --output output/feedback-office/layout
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os == 'macOS'
        with:
          name: office-review-${{ matrix.target }}
          path: output/feedback-office
  backup-exchange:
    needs: native-package
    # Exercise uploaded packages even if a later external Office check fails.
    # Missing/failed native builds still fail the artifact download; no check is waived.
    if: ${{ always() && !cancelled() && !inputs.viewer_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pilot-${{ matrix.target }}
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: backup-*
          path: incoming-backups
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: legacy-*
          path: incoming-backups/legacy
      - run: python -m pip install pypdf==6.10.0
      - run: python scripts/bundle_smoke.py release/BLExhibitManager-0.6.0-${{ matrix.target }}.zip incoming-backups
  native-viewer:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.viewer_only }}
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm ci --prefix web
      - run: npx --prefix web playwright install chromium
      - name: Download pinned official portable viewer without installation
        run: node scripts/download_viewer_ci.cjs output/viewer-tools/SumatraPDF-3.6.1-64.zip
      - name: Click native PDF links before and after relocation on CI desktop only
        run: python scripts/verify_index_viewer_ci.py --viewer-zip output/viewer-tools/SumatraPDF-3.6.1-64.zip --output output/viewer-qa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-viewer-qa
          path: |
            output/viewer-qa/*.png
            output/viewer-qa/report.json
            output/viewer-qa/*-clipboard.json
          if-no-files-found: warn
