name: Diagnose synthetic DOCX layout
on:
  push:
    branches: [codex/docx-pdf-layout]
    paths: [scripts/layout_probe.py, .github/workflows/layout-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock pymupdf==1.28.2
      - run: bash scripts/install_ci_libreoffice.sh
      - run: python scripts/layout_probe.py --output output/layout-probe
      - name: Record font availability
        run: system_profiler SPFontsDataType -json > output/layout-probe/system-fonts.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: layout-probe-${{ matrix.os }}
          path: output/layout-probe
